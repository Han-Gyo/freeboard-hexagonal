spring:
  application:
    name: freeboard
  datasource:
    url: jdbc:mysql://localhost:3306/freeboard
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 10  # Lazy 연관 조회를 이 개수만큼 IN으로 묶음