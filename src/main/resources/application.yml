spring:
  application:
    name: freeboard
  datasource:
    url: jdbc:mysql://localhost:3306/freeboard
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 10  # Lazy 연관 조회를 이 개수만큼 IN으로 묶음

# JWT 서명용 서버 비밀키 (사원증에 찍는 도장). 사람마다 다르지 않고 서버 공통.
# 로컬 연습용 값. 나중에 환경변수로 빼는 게 안전하다.
jwt:
  secret: freeboard-local-jwt-secret-key-change-me-32bytes-min
  # Access: API 호출용. 짧게 잡음. 만료되면 Refresh로 새로 받음
  # 1시간 = 3600000ms
  access-token-validity-ms: 3600000
  # Refresh: Access 재발급권. Access보다 길게.
  # 이 시간 지나면 다시 로그인해야 함. 7일 = 604800000ms
  # (서버가 타이머로 자동 갱신하는 값이 아님. 클라이언트가 /auth/refresh 호출할 때 씀)
  refresh-token-validity-ms: 604800000